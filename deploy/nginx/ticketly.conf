# nginx reverse proxy + load balancer for the Ticketly-GDS API instances.
# The API instances run on 3001..3004 (systemd templated units); nginx balances
# across them, terminates TLS, and — critically — its idle timeout must be
# SHORTER than the API's keepAliveTimeout (72s) so nginx closes reused
# connections first, avoiding 502s. Health checks hit /health/ready so a
# draining instance is removed from rotation during a rolling deploy.
upstream ticketly_api {
    least_conn;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:3003 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:3004 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    # Ticketly's three-domain scheme, all served by the same API fleet — the
    # app-layer TenantResolutionMiddleware reads the Host header to tell them
    # apart, so nginx needs no per-operator config:
    #   ticketly.com / www.ticketly.com    → customer storefront (no tenant)
    #   app.ticketly.com                   → super-admin console (no tenant)
    #   app.<slug>.ticketly.com            → one operator's admin console
    # `*.ticketly.com` only matches a single label, so `app.<slug>.ticketly.com`
    # needs the regex alternative below.
    server_name ticketly.com www.ticketly.com app.ticketly.com *.ticketly.com
                ~^app\.(?<tenant_slug>[^.]+)\.ticketly\.com$;

    # ssl_certificate / ssl_certificate_key: a wildcard cert for *.ticketly.com
    # (plus the apex as a SAN) covers every host above — managed by certbot/ACME
    # DNS-01, since HTTP-01 can't validate a wildcard.

    # The host (and, for tenant consoles, the slug) reaches the app via the
    # Host header, which the tenant-resolution middleware reads — no
    # per-tenant nginx config.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # X-Forwarded-For: the app takes the LAST entry (trusted), so nginx appends.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keepalive to upstreams (requires HTTP/1.1 + cleared Connection header).
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Shorter than the app's keepAliveTimeout to avoid reuse races → 502s.
    proxy_read_timeout 60s;
    keepalive_timeout 65s;

    client_max_body_size 2m;   # booking payloads are small; cap the attack surface

    location / {
        proxy_pass http://ticketly_api;
    }

    # The webhook route needs the RAW body preserved for signature verification;
    # nginx passes it through unmodified by default (no proxy_set_body).
    location /api/v1/payments/webhook/ {
        proxy_pass http://ticketly_api;
    }

    # Metrics must NOT be publicly exposed — bind to the internal network only.
    location /metrics { deny all; return 403; }
}
