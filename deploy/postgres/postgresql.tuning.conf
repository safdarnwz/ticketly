# PostgreSQL tuning for the Ticketly-GDS workload (append to postgresql.conf).
# Baseline for a dedicated 8-core / 32GB primary; scale with hardware.
# The workload: short OLTP transactions (booking), heavy indexed reads (search),
# a high-write partitioned table (gps_pings), and periodic MV refreshes.

# ── Memory ──
shared_buffers = 8GB                 # ~25% of RAM
effective_cache_size = 24GB          # ~75% of RAM (planner hint)
work_mem = 32MB                      # per sort/hash; search uses several
maintenance_work_mem = 1GB           # index builds, VACUUM, MV refresh

# ── Write / WAL ──  (booking is write-heavy; keep WAL flushing efficient)
wal_compression = on
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 2GB
synchronous_commit = on              # NEVER off — a lost booking commit is a lost seat

# ── Planner / parallelism ──
random_page_cost = 1.1               # SSD storage
effective_io_concurrency = 200       # SSD
max_worker_processes = 8
max_parallel_workers_per_gather = 2  # reports use it; keep low for OLTP

# ── Connections ──  (the app pools; keep this modest and let PgBouncer front it)
max_connections = 200

# ── Autovacuum ──  (gps_pings & outbox churn heavily; be aggressive)
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ── Replication (for read replicas) ──
wal_level = replica
max_wal_senders = 5
hot_standby = on

# ── Observability ──
log_min_duration_statement = 200ms   # log slow queries (matches app's threshold)
log_lock_waits = on
log_checkpoints = on
track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
