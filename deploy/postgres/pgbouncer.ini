; PgBouncer — connection pooler in front of Postgres.
; With many API instances each holding a pool, PgBouncer in transaction mode
; multiplexes them onto a small number of real Postgres connections, so the DB
; never runs out of backends. transaction mode is required (session mode would
; pin a connection per client and defeat the purpose).
[databases]
ticketly = host=127.0.0.1 port=5432 dbname=ticketly

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
reserve_pool_size = 10
server_idle_timeout = 300
; The app sets app.tenant_id per checkout; transaction pooling is compatible
; because the GUC is set inside each transaction (SET LOCAL in the unit of work).
