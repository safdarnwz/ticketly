# Release pipeline: every change reaches main through its own pull request,
# and every green commit on main is promoted main → stage → uat → prod.
#
#  1. A PR into main runs CI (ci.yml). When CI passes, this workflow approves
#     and merges the PR (squash) and deletes its branch.
#  2. The merged commit — or any commit pushed straight to main whose CI
#     passed — goes to stage, then uat, then prod, one environment job after
#     the other (promote.yml): fast-forward the branch, then deploy it.
#     Each environment branch only ever receives commits that passed CI on
#     main, and never diverges from it (fast-forward only; a promotion that
#     cannot fast-forward fails loudly instead of overwriting).
#
# Pushes made with GITHUB_TOKEN do not start other workflows, so the merge
# and the promotions all happen here, in one run.
name: Pipeline

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  merge-pr:
    # A green PR from this repository into main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Approve and merge
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', head: `${owner}:${run.head_branch}`,
            });
            const pr = prs.find((p) => p.head.sha === run.head_sha);
            if (!pr) {
              core.info(`No open PR into main at ${run.head_sha} (already merged, or a newer push) — nothing to do`);
              return;
            }
            try {
              await github.rest.pulls.createReview({ owner, repo, pull_number: pr.number, event: 'APPROVE',
                body: 'CI passed — approved automatically by the release pipeline.' });
            } catch (e) {
              // Needs "Allow GitHub Actions to create and approve pull requests"; merging does not.
              core.warning(`Could not approve #${pr.number}: ${e.message}`);
            }
            const merged = await github.rest.pulls.merge({ owner, repo, pull_number: pr.number,
              merge_method: 'squash', sha: run.head_sha });
            core.info(`Merged #${pr.number} as ${merged.data.sha}`);
            core.setOutput('sha', merged.data.sha);
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
            } catch (e) {
              core.warning(`Could not delete branch ${pr.head.ref}: ${e.message}`);
            }

  resolve:
    needs: merge-pr
    # After a merge above, or when CI passed on a push to main.
    if: >-
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      ((needs.merge-pr.result == 'success' && needs.merge-pr.outputs.sha != '') ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${{ needs.merge-pr.outputs.sha || github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  # One job per environment, in order. Each shows up under the repository's
  # Environments / Deployments, fast-forwards its branch, then deploys it.
  stage:
    needs: resolve
    uses: ./.github/workflows/promote.yml
    with: { environment: stage, sha: '${{ needs.resolve.outputs.sha }}' }
    secrets: inherit

  uat:
    needs: [resolve, stage]
    uses: ./.github/workflows/promote.yml
    with: { environment: uat, sha: '${{ needs.resolve.outputs.sha }}' }
    secrets: inherit

  prod:
    needs: [resolve, uat]
    uses: ./.github/workflows/promote.yml
    with: { environment: prod, sha: '${{ needs.resolve.outputs.sha }}' }
    secrets: inherit
