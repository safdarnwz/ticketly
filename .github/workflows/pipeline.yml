# Continuous delivery — main → stage → uat → prod.
#
#   CI green on a PR into main ──▶ merge-pr: approve, squash-merge, delete the branch
#   CI green on main (or a merge above)
#     ──▶ build:   build ONCE, package, checksum, version (vYYYY.MM.DD.N)
#     ──▶ stage ──▶ uat ──▶ prod   (deploy.yml, one GitHub Environment each):
#            deploy that exact artifact, smoke-test it, roll back on failure,
#            then fast-forward the environment branch to the commit
#     ──▶ release: tag the commit and publish a GitHub Release with the artifact
#
# A failure anywhere stops the release there; later environments keep the
# previous version. Pushes with GITHUB_TOKEN start no other workflows, so the
# merge and everything after it happen in this one run.
name: Pipeline

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  # One release at a time; a queued one waits, it is never cancelled mid-way.
  group: pipeline
  cancel-in-progress: false

jobs:
  merge-pr:
    name: Merge the PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Approve and squash-merge
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', head: `${owner}:${run.head_branch}`,
            });
            const pr = prs.find((p) => p.head.sha === run.head_sha);
            if (!pr) {
              core.info(`No open PR into main at ${run.head_sha} (already merged, or a newer push) — nothing to do`);
              return;
            }
            if (pr.draft) {
              core.info(`#${pr.number} is a draft — not merged`);
              return;
            }
            try {
              await github.rest.pulls.createReview({ owner, repo, pull_number: pr.number, event: 'APPROVE',
                body: 'All CI gates passed — approved by the release pipeline.' });
            } catch (e) {
              // Needs "Allow GitHub Actions to create and approve pull requests"; merging does not.
              core.warning(`Could not approve #${pr.number}: ${e.message}`);
            }
            const merged = await github.rest.pulls.merge({ owner, repo, pull_number: pr.number,
              merge_method: 'squash', sha: run.head_sha, commit_title: `${pr.title} (#${pr.number})` });
            core.info(`Merged #${pr.number} as ${merged.data.sha}`);
            core.setOutput('sha', merged.data.sha);
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
            } catch (e) {
              core.warning(`Could not delete branch ${pr.head.ref}: ${e.message}`);
            }

  build:
    name: Build the release
    needs: merge-pr
    # After a merge above, or when CI passed on a push to main.
    if: >-
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      ((needs.merge-pr.result == 'success' && needs.merge-pr.outputs.sha != '') ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge-pr.outputs.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Version
        id: version
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch --tags --quiet
          # A commit already released keeps its version; otherwise the next vYYYY.MM.DD.N of today.
          existing=$(git tag --points-at "$sha" --list 'v*' | head -1)
          if [ -n "$existing" ]; then
            version=$existing
          else
            day=$(date -u +%Y.%m.%d)
            n=$(( $(git tag --list "v$day.*" | wc -l) + 1 ))
            version="v$day.$n"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Release $version — \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: bash scripts/package-release.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          retention-days: 90
          if-no-files-found: error

  stage:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      {
        environment: stage,
        version: '${{ needs.build.outputs.version }}',
        sha: '${{ needs.build.outputs.sha }}',
      }
    secrets: inherit
    permissions: { contents: write }

  uat:
    needs: [build, stage]
    uses: ./.github/workflows/deploy.yml
    with:
      {
        environment: uat,
        version: '${{ needs.build.outputs.version }}',
        sha: '${{ needs.build.outputs.sha }}',
      }
    secrets: inherit
    permissions: { contents: write }

  prod:
    needs: [build, uat]
    uses: ./.github/workflows/deploy.yml
    with:
      {
        environment: prod,
        version: '${{ needs.build.outputs.version }}',
        sha: '${{ needs.build.outputs.sha }}',
      }
    secrets: inherit
    permissions: { contents: write }

  release:
    name: Tag and publish the release
    needs: [build, prod]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release, path: release }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$VERSION already published"; exit 0
          fi
          gh release create "$VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "$VERSION" --generate-notes --latest
