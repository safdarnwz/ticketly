name: Build 2ndShaadi Android APK

# Builds the 2ndShaadi customer app (folder 2ndshaadi-mobile) on this branch only,
# and commits the APKs to 2ndshaadi-mobile/dist so they can be downloaded.

on:
  push:
    branches: [claude/determined-gates-ji1wbt]
    paths:
      - '2ndshaadi-mobile/**'
      - '!2ndshaadi-mobile/dist/**'
      - '.github/workflows/2ndshaadi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 2ndshaadi-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: 2ndshaadi-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Checks
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build APKs (one per phone type, each well under 50 MB)
        run: |
          # Test build: plain http allowed so it can talk to a computer on the same Wi-Fi;
          # the server address can be changed in the app (long-press the logo).
          echo "cleartext=true" >> android/gradle.properties
          flutter build apk --release --split-per-abi \
            --dart-define=DEV_TOOLS=true \
            --dart-define=API_URL=https://2ndshadi.com
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/2ndShaadi-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/2ndShaadi-arm32.apk
          ls -la dist
          for f in dist/*.apk; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 52428800 ]; then echo "$f is larger than 50 MB"; exit 1; fi
          done
      - name: Commit the APKs
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 2ndshaadi-mobile/dist/*.apk
          git commit -m "2ndShaadi APK build ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
