name: Publish dashboard to GitHub Pages

# Publishes the Shelfwise website (the UI) to GitHub Pages. Visitors' browsers fetch live data
# from the Shelfwise server running in Docker on their own computer (http://localhost:8080 by
# default; override with the repository variable PAGES_SERVER_URL).
#
# A fallback snapshot (data/report.json) is published too, shown when no server is running.
# By default it is DEMO data, so nothing confidential is published.
# To publish real SalesDiary numbers (visible to ANYONE with the URL):
#   1. Settings -> Secrets and variables -> Actions -> Secrets:
#        SD_COMPANY_KEY, SD_USERNAME, SD_PASSWORD   (the build signs in, so tokens never go stale)
#   2. Settings -> Secrets and variables -> Actions -> Variables:  PAGES_LIVE_DATA = true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static snapshot
        run: npm run build:static
        env:
          PAGES_SERVER_URL: ${{ vars.PAGES_SERVER_URL }}
          SNAPSHOT_SOURCE: ${{ vars.PAGES_LIVE_DATA == 'true' && 'live' || 'mock' }}
          SD_COMPANY_KEY: ${{ vars.PAGES_LIVE_DATA == 'true' && secrets.SD_COMPANY_KEY || '' }}
          SD_USERNAME: ${{ vars.PAGES_LIVE_DATA == 'true' && secrets.SD_USERNAME || '' }}
          SD_PASSWORD: ${{ vars.PAGES_LIVE_DATA == 'true' && secrets.SD_PASSWORD || '' }}
          SD_TOKEN: ${{ vars.PAGES_LIVE_DATA == 'true' && secrets.SD_TOKEN || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
