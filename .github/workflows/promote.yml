# Promote one commit of main to one environment (called by pipeline.yml, in
# the order stage → uat → prod):
#   1. fast-forward the environment branch to the commit — never a force
#      push: a branch that has diverged from main stops the release;
#   2. verify that exact commit builds (install + typecheck + unit tests);
#   3. deploy, when the environment has a DEPLOY_WEBHOOK_URL secret (a
#      POST with the environment, branch and commit — the hosting platform
#      pulls the branch). Without the secret the branch is still promoted.
# The job runs in the GitHub Environment of the same name, so protection
# rules and secrets can be set per environment.
name: Promote

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      sha: { type: string, required: true }

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: promote-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Verify the commit
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Fast-forward ${{ inputs.environment }}
        env:
          ENV_BRANCH: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main — only main's commits are promoted"; exit 1; }
          if git ls-remote --exit-code --heads origin "$ENV_BRANCH" >/dev/null; then
            git fetch origin "$ENV_BRANCH"
            if git merge-base --is-ancestor "$SHA" "origin/$ENV_BRANCH"; then
              echo "$ENV_BRANCH already has $SHA"; exit 0
            fi
            git merge-base --is-ancestor "origin/$ENV_BRANCH" "$SHA" \
              || { echo "::error::$ENV_BRANCH has commits that are not on main — fix it by hand, it is never overwritten"; exit 1; }
          fi
          git push origin "$SHA:refs/heads/$ENV_BRANCH"
          echo "### Promoted \`$SHA\` to **$ENV_BRANCH**" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy ${{ inputs.environment }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          ENV_NAME: ${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "No DEPLOY_WEBHOOK_URL secret for $ENV_NAME — branch promoted, nothing to deploy to yet."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "$DEPLOY_WEBHOOK_URL" \
            -H 'content-type: application/json' \
            -d "$(printf '{"environment":"%s","branch":"%s","commit":"%s"}' "$ENV_NAME" "$ENV_NAME" "$SHA")"
