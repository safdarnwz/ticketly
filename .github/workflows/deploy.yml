# Deploy one release to one environment (called by pipeline.yml, in the order
# stage → uat → prod). Runs in the GitHub Environment of the same name, so
# every environment has its own hosts, keys, URL and, if wanted, a required
# reviewer (Settings → Environments) — without changing this file.
#
#   1. Check the environment branch can fast-forward to the commit (a branch
#      someone committed to directly stops the release — never overwritten).
#   2. Deploy the exact artifact from the build job to every host in
#      DEPLOY_HOSTS, one host at a time (deploy/release.sh: install, migrate,
#      rolling restart behind health checks, automatic rollback per host).
#   3. Smoke-test APP_URL; on failure roll every host back and stop.
#   4. Fast-forward the environment branch: the branch is what is live.
#
# Environment settings:
#   vars.DEPLOY_HOSTS      "deploy@10.0.0.11 deploy@10.0.0.12" (empty → promote the branch only)
#   vars.APP_URL           "https://stage-api.ticketly.in"      (smoke test + link in GitHub)
#   secrets.DEPLOY_SSH_KEY       private key of the deploy user
#   secrets.DEPLOY_KNOWN_HOSTS   ssh-keyscan output for the hosts (host keys are verified)
name: Deploy

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      version: { type: string, required: true }
      sha: { type: string, required: true }

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENV_NAME: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      DEPLOY_HOSTS: ${{ vars.DEPLOY_HOSTS }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.sha }}', fetch-depth: 0 }

      - name: The environment branch can move to this commit
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main — only main's commits are released"; exit 1; }
          if git ls-remote --exit-code --heads origin "$ENV_NAME" >/dev/null; then
            git fetch origin "$ENV_NAME"
            git merge-base --is-ancestor "origin/$ENV_NAME" "$SHA" \
              || { echo "::error::$ENV_NAME has commits that are not on main — fix it by hand, it is never overwritten"; exit 1; }
          fi

      - uses: actions/download-artifact@v4
        with: { name: release, path: release }

      - name: Verify the artifact
        run: |
          set -euo pipefail
          cd release && sha256sum -c "ticketly-$VERSION.tgz.sha256"
          tar -xzOf "ticketly-$VERSION.tgz" ./RELEASE | grep -qx "commit=$SHA" \
            || { echo "::error::artifact was not built from $SHA"; exit 1; }

      - name: Deploy to ${{ inputs.environment }} hosts
        if: vars.DEPLOY_HOSTS != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] \
            || { echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS secrets are required with DEPLOY_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes"
          tarball="release/ticketly-$VERSION.tgz"
          for host in $DEPLOY_HOSTS; do
            echo "::group::$host"
            $SSH "$host" 'mkdir -p /opt/ticketly/incoming'
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$tarball" "$host:/opt/ticketly/incoming/"
            # The release script ships inside the artifact; run that version of it.
            $SSH "$host" "set -e; d=\$(mktemp -d); tar -xzf /opt/ticketly/incoming/ticketly-$VERSION.tgz -C \$d ./deploy/release.sh; \
              bash \$d/deploy/release.sh deploy /opt/ticketly/incoming/ticketly-$VERSION.tgz $VERSION; rm -rf \$d"
            echo "::endgroup::"
          done

      - name: Smoke test
        id: smoke
        if: vars.APP_URL != ''
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 "$APP_URL/health/ready" >/dev/null && curl -fsS --max-time 5 "$APP_URL/health/live" >/dev/null; then
              echo "healthy after $attempt attempt(s)"; exit 0
            fi
            sleep 6
          done
          echo "::error::$APP_URL is not healthy after the deploy"
          exit 1

      - name: Roll back
        if: failure() && steps.smoke.conclusion == 'failure' && vars.DEPLOY_HOSTS != ''
        run: |
          for host in $DEPLOY_HOSTS; do
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$host" \
              'bash /opt/ticketly/current/deploy/release.sh rollback' || echo "::error::rollback failed on $host"
          done

      - name: Fast-forward ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$SHA" "origin/$ENV_NAME" 2>/dev/null; then
            echo "$ENV_NAME already at or past $SHA"
          else
            git push origin "$SHA:refs/heads/$ENV_NAME"
          fi
          if [ -n "$DEPLOY_HOSTS" ]; then what="deployed to $DEPLOY_HOSTS"; else what="branch promoted (no DEPLOY_HOSTS set, nothing deployed)"; fi
          echo "### $ENV_NAME: $VERSION — $what" >> "$GITHUB_STEP_SUMMARY"
