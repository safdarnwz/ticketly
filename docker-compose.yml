services:
  shelfwise:
    build: .
    image: shelfwise:latest
    container_name: shelfwise
    # Bound to this computer only: the dashboard on GitHub Pages talks to http://localhost:8080
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
